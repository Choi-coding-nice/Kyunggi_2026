<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미적분 9번 - a에 따른 함수 그래프</title>
<style>
  body{font-family:Arial,"Malgun Gothic",sans-serif;margin:0;background:#f6f7fb;color:#222}
  .wrap{max-width:1050px;margin:24px auto;padding:20px}
  .card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0001;margin-bottom:16px}
  h1{margin:0 0 10px;font-size:24px}
  .formula{font-size:20px;line-height:1.8}
  .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  input[type=range]{width:420px;max-width:90%}
  .aval{font-size:24px;font-weight:bold;min-width:90px}
  button{border:0;border-radius:9px;padding:9px 14px;background:#eee;cursor:pointer}
  button:hover{background:#ddd}
  canvas{width:100%;height:540px;border:1px solid #ddd;border-radius:12px;background:#fff}
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:14px}
  .dot{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:6px;background:#2563eb}
  .dot2{background:#dc2626}
  .info{font-size:15px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>2024년 10월 고2 20번 — a값에 따른 그래프</h1>
    <div class="formula">
      <b>f(x) =</b>
      <span>
        (x−1)(x−a), &nbsp;x&lt;1;&nbsp;&nbsp;
        0, &nbsp;1≤x&lt;2;&nbsp;&nbsp;
        1, &nbsp;x≥2
      </span>
    </div>
    <div class="controls">
      <b>a =</b>
      <input id="slider" type="range" min="-3" max="3" step="0.01" value="-1.5">
      <span class="aval" id="avalue">−1.50</span>
      <button onclick="setA(-2)">−2</button>
      <button onclick="setA(-1.5)">−1.5</button>
      <button onclick="setA(-1)">−1</button>
      <button onclick="setA(0)">0</button>
      <button onclick="setA(1)">1</button>
      <button onclick="setA(2)">2</button>
    </div>
  </div>

  <div class="card">
    <canvas id="graph" width="1000" height="540"></canvas>
    <div class="legend">
      <span><i class="dot"></i> y=f(x)</span>
      <span><i class="dot dot2"></i> y=−3/2</span>
    </div>
  </div>

  <div class="card info" id="status"></div>
</div>

<script>
const canvas=document.getElementById("graph"), ctx=canvas.getContext("2d");
const slider=document.getElementById("slider"), avalue=document.getElementById("avalue");
const status=document.getElementById("status");

const xmin=-3, xmax=4, ymin=-4, ymax=4;
function X(x){return (x-xmin)/(xmax-xmin)*canvas.width}
function Y(y){return canvas.height-(y-ymin)/(ymax-ymin)*canvas.height}
function f(x,a){
  if(x<1) return (x-1)*(x-a);
  if(x<2) return 0;
  return 1;
}
function draw(){
  const a=parseFloat(slider.value);
  avalue.textContent=(a<0?"−":"")+Math.abs(a).toFixed(2);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // grid
  ctx.lineWidth=1; ctx.strokeStyle="#e5e7eb";
  for(let x=Math.ceil(xmin);x<=xmax;x++){
    ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),canvas.height);ctx.stroke();
  }
  for(let y=Math.ceil(ymin);y<=ymax;y++){
    ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(canvas.width,Y(y));ctx.stroke();
  }

  // axes
  ctx.strokeStyle="#555";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),canvas.height);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(canvas.width,Y(0));ctx.stroke();

  ctx.fillStyle="#444";ctx.font="13px Arial";
  for(let x=Math.ceil(xmin);x<=xmax;x++) ctx.fillText(x,X(x)+4,Y(0)-7);
  for(let y=Math.ceil(ymin);y<=ymax;y++) if(y!==0) ctx.fillText(y, X(0)+7,Y(y)-4);

  // y=-3/2
  ctx.strokeStyle="#dc2626";ctx.lineWidth=2;ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(0,Y(-1.5));ctx.lineTo(canvas.width,Y(-1.5));ctx.stroke();
  ctx.setLineDash([]);

  // f(x), left quadratic
  ctx.strokeStyle="#2563eb";ctx.lineWidth=3;
  ctx.beginPath();
  let first=true;
  for(let px=0;px<=canvas.width;px++){
    const x=xmin+(xmax-xmin)*px/canvas.width;
    if(x<1){
      const y=f(x,a);
      if(first){ctx.moveTo(px,Y(y));first=false}else ctx.lineTo(px,Y(y));
    }
  }
  ctx.stroke();

  // constant pieces
  ctx.beginPath();ctx.moveTo(X(1),Y(0));ctx.lineTo(X(2),Y(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(X(2),Y(1));ctx.lineTo(canvas.width,Y(1));ctx.stroke();

  // endpoint markers: x=1 open/closed and x=2
  function point(x,y,open=false){
    ctx.beginPath();ctx.arc(X(x),Y(y),5,0,2*Math.PI);
    ctx.fillStyle=open?"white":"#2563eb";ctx.fill();
    ctx.strokeStyle="#2563eb";ctx.lineWidth=2;ctx.stroke();
  }
  point(1,0,false); // middle piece includes x=1
  point(2,0,true);  // middle excludes x=2
  point(2,1,false);

  // vertex if it lies in x<1
  const xv=(1+a)/2, yv=f(xv,a);
  if(xv<1 && xv>=xmin && xv<=xmax && yv>=ymin && yv<=ymax) point(xv,yv,false);

  let text="";
  if(a>0) text += "<b>a &gt; 0</b>에서는 x&lt;1 구간의 그래프가 y=-3/2 아래로 내려가지 않습니다.<br>";
  if(a===0) text += "<b>a = 0</b>에서는 x&lt;1 부분이 x(x−1)입니다.<br>";
  if(a<0) text += "<b>a &lt; 0</b>이면 x&lt;1 구간의 포물선이 내려갈 수 있습니다.<br>";
  text += "현재 <b>a = "+a.toFixed(2)+"</b>입니다. 빨간 점선은 <b>y = −3/2</b>입니다.";
  status.innerHTML=text;
}
function setA(v){slider.value=v;draw()}
slider.addEventListener("input",draw);
draw();
</script>
</body>
</html>
