<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>마을 안전 지킴이! CCTV 최적 설치 시뮬레이터</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .grid-dots {
      background-size: 22px 22px;
      background-image: radial-gradient(circle, #334155 1.3px, transparent 1.3px);
    }
    @keyframes radar-pulse-standard {
      0% { r: 16px; opacity: 0.9; }
      100% { r: 38px; opacity: 0; }
    }
    @keyframes radar-pulse-high {
      0% { r: 18px; opacity: 1; }
      60% { r: 48px; opacity: 0.45; }
      100% { r: 68px; opacity: 0; }
    }
    .radar-std {
      animation: radar-pulse-standard 1.9s cubic-bezier(0.16, 0.8, 0.38, 1) infinite;
    }
    .radar-high {
      animation: radar-pulse-high 2.2s cubic-bezier(0.12, 0.75, 0.35, 1) infinite;
    }
    .badge-pop {
      animation: badgePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes badgePop {
      0% { transform: scale(0.6) translateY(4px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    /* 모바일 가로 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-6">

  <!-- Mobile-Optimized Sticky Top Header -->
  <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-3 py-2 sm:px-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-500 to-teal-500 flex items-center justify-center text-white text-sm shadow shrink-0">
          <i class="fa-solid fa-shield-cat"></i>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-extrabold text-white leading-tight">마을 CCTV 최적 설치</h1>
          <p class="text-[10px] sm:text-xs text-slate-400">일반(거리 1, 1원) & 고성능(거리 2, 2원)</p>
        </div>
      </div>

      <!-- Compact Action Controls -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="resetResultHighlights()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-semibold flex items-center gap-1">
          <i class="fa-solid fa-eraser"></i>
          <span class="hidden sm:inline">표시</span>지우기
        </button>
        <button onclick="clearGraph()" class="px-2.5 py-1.5 rounded-lg bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 border border-rose-800/60 text-xs font-semibold flex items-center gap-1">
          <i class="fa-solid fa-rotate-left"></i>
          <span class="hidden sm:inline">새로</span>초기화
        </button>
      </div>
    </div>

    <!-- Mobile Preset Village Horizontal Scroller -->
    <div class="max-w-4xl mx-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-2 text-xs">
      <span class="text-slate-400 font-bold shrink-0 text-[11px] mr-0.5">
        <i class="fa-solid fa-map-location-dot text-emerald-400"></i> 마을 예시:
      </span>
      <button onclick="loadPreset('wheel')" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 whitespace-nowrap text-[11px] font-medium">🎡 바퀴</button>
      <button onclick="loadPreset('petersen')" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 whitespace-nowrap text-[11px] font-medium">🧩 피터슨</button>
      <button onclick="loadPreset('cycle7')" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 whitespace-nowrap text-[11px] font-medium">⭕ 순환 7거리</button>
      <button onclick="loadPreset('k33')" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 whitespace-nowrap text-[11px] font-medium">🌉 이분 마을</button>
      <button onclick="loadPreset('tree')" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 whitespace-nowrap text-[11px] font-medium">🌳 나뭇가지</button>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-2.5 sm:p-4 flex flex-col gap-2.5">
    
    <!-- 3 Core Calculation Buttons (Grid) -->
    <div class="grid grid-cols-3 gap-1.5 sm:gap-2.5">
      <!-- Button 1 -->
      <button id="btn-calc-dom" onclick="calculateDominatingSet()" class="p-2 sm:p-3 rounded-xl bg-gradient-to-b from-emerald-950/80 to-slate-900 border border-emerald-500/40 hover:border-emerald-400 text-left active:scale-95 transition">
        <div class="flex items-center gap-1.5">
          <span class="w-5 h-5 rounded-md bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-black text-[11px] shrink-0">1</span>
          <span class="text-[10px] text-emerald-400 font-bold uppercase truncate">지배수</span>
        </div>
        <div class="text-[11px] sm:text-xs font-black text-white mt-1 leading-snug">최소 CCTV 개수</div>
      </button>

      <!-- Button 2 -->
      <button id="btn-calc-indep" onclick="calculateIndependentDominatingSet()" class="p-2 sm:p-3 rounded-xl bg-gradient-to-b from-purple-950/80 to-slate-900 border border-purple-500/40 hover:border-purple-400 text-left active:scale-95 transition">
        <div class="flex items-center gap-1.5">
          <span class="w-5 h-5 rounded-md bg-purple-500/20 text-purple-400 flex items-center justify-center font-black text-tx-[11px] shrink-0">2</span>
          <span class="text-[10px] text-purple-400 font-bold uppercase truncate">독립 지배수</span>
        </div>
        <div class="text-[11px] sm:text-xs font-black text-white mt-1 leading-snug">안 붙은 최소 CCTV</div>
      </button>

      <!-- Button 3 -->
      <button id="btn-calc-high" onclick="calculateHighPerfCost()" class="p-2 sm:p-3 rounded-xl bg-gradient-to-b from-amber-950/80 to-slate-900 border border-amber-500/40 hover:border-amber-400 text-left active:scale-95 transition">
        <div class="flex items-center gap-1.5">
          <span class="w-5 h-5 rounded-md bg-amber-500/20 text-amber-400 flex items-center justify-center font-black text-[11px] shrink-0">3</span>
          <span class="text-[10px] text-amber-400 font-bold uppercase truncate">고성능(2원)</span>
        </div>
        <div class="text-[11px] sm:text-xs font-black text-amber-300 mt-1 leading-snug">고성능 최소 비용</div>
      </button>
    </div>

    <!-- Edit Modes Toolbar (Horizontal Scrolling for Mobile) -->
    <div class="bg-slate-900/90 border border-slate-800 p-1.5 rounded-xl flex items-center gap-1 overflow-x-auto no-scrollbar text-xs font-bold">
      <button id="mode-select" onclick="setMode('select')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-800 text-emerald-400 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-arrows-up-down-left-right text-xs"></i>
        <span>이동</span>
      </button>
      <button id="mode-vertex" onclick="setMode('vertex')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-circle-plus text-xs"></i>
        <span>지점 추가</span>
      </button>
      <button id="mode-edge" onclick="setMode('edge')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-bezier-curve text-xs"></i>
        <span>길 연결</span>
      </button>
      <button id="mode-manual" onclick="setMode('manual')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-amber-400 hover:text-amber-300 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-hand-pointer text-xs"></i>
        <span>직접 설치</span>
      </button>
      <button id="mode-delete" onclick="setMode('delete')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-rose-400 hover:text-rose-300 shrink-0 whitespace-nowrap">
        <i class="fa-solid fa-trash-can text-xs"></i>
        <span>삭제</span>
      </button>
    </div>

    <!-- SVG Graph Canvas Box (Unobscured by Floating Overlays) -->
    <div class="relative w-full h-[380px] sm:h-[460px] bg-slate-900/90 rounded-2xl border border-slate-800 shadow-lg overflow-hidden flex flex-col">
      
      <!-- Manual Play Mode Realtime Status Mini Strip (Top) -->
      <div id="manual-play-hud" class="hidden absolute top-2 inset-x-2 z-20 bg-amber-950/90 backdrop-blur-md border border-amber-500/40 px-2.5 py-1.5 rounded-lg shadow flex items-center justify-between text-xs">
        <span class="text-[11px] text-amber-300 font-bold truncate">👆 지점 클릭: [0원 → 1원 → 2원] 순환</span>
        <span id="manual-stats-badge" class="px-2 py-0.5 rounded text-[10px] font-black bg-amber-500/20 text-amber-300 shrink-0">
          비용 0원 | 감시 0/0
        </span>
      </div>

      <!-- Graph Canvas Guide Tip (Top Left Small) -->
      <div class="absolute top-2 left-2 z-10 bg-slate-950/70 backdrop-blur-sm border border-slate-800/80 px-2 py-1 rounded-md text-[10px] text-slate-400 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span id="canvas-guide-text">지점을 드래그하여 이동할 수 있습니다.</span>
      </div>

      <!-- Canvas SVG -->
      <svg id="graph-svg" class="w-full h-full flex-1 grid-dots cursor-default select-none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow-green" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.9"/>
          </filter>
          <filter id="glow-purple" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.9"/>
          </filter>
          <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.95"/>
          </filter>
        </defs>
        <g id="edges-layer"></g>
        <g id="coverage-beams-layer"></g>
        <g id="temp-edge-layer"></g>
        <g id="nodes-layer"></g>
        <g id="badges-layer"></g>
      </svg>

      <!-- Bottom Status Bar -->
      <div class="bg-slate-950/90 border-t border-slate-800/80 px-3 py-1.5 text-[11px] text-slate-400 flex justify-between items-center">
        <div>지점: <strong id="stat-vertex-count" class="text-white">0</strong>곳 / 길: <strong id="stat-edge-count" class="text-white">0</strong>개</div>
        <div class="text-[10px] text-slate-500">💡 1, 2, 3번 버튼을 누르면 아래에 답이 나옵니다</div>
      </div>
    </div>

    <!-- Bottom Result Notification Area (Placed BELOW Canvas to Avoid Covering Graph) -->
    <div id="bottom-answer-panel" class="hidden transition-all duration-300">
      <div id="result-card-box" class="p-4 rounded-2xl bg-slate-900 border shadow-lg space-y-3">
        <!-- Result Header -->
        <div class="flex items-center justify-between gap-2 border-b border-slate-800 pb-2.5">
          <div class="flex items-center gap-2">
            <span id="result-icon-badge" class="w-8 h-8 rounded-xl flex items-center justify-center text-lg font-black shrink-0">🎯</span>
            <div>
              <div id="result-type-tag" class="text-[10px] font-black uppercase tracking-wider text-emerald-400">최소 CCTV 계산 결과</div>
              <h2 id="result-main-title" class="text-xs sm:text-sm font-black text-white">마을 전체 감시 최소 CCTV</h2>
            </div>
          </div>
          <div class="text-right">
            <div id="result-score-highlight" class="text-xl sm:text-2xl font-black text-emerald-400">-</div>
            <div id="result-cost-subtext" class="text-[10px] text-slate-400 font-semibold">비용 0원</div>
          </div>
        </div>

        <!-- Installed Nodes List -->
        <div>
          <div class="text-[11px] font-bold text-slate-400 mb-1 flex items-center justify-between">
            <span>설치된 CCTV 위치:</span>
            <span id="result-installed-count" class="text-[10px] text-slate-300 font-semibold">0곳</span>
          </div>
          <div id="result-node-chips" class="flex flex-wrap gap-1.5">
            <!-- Node chips injected here -->
          </div>
        </div>

        <!-- Cost Breakdown / Math Explanation Text -->
        <div id="result-formula-box" class="hidden p-2.5 rounded-xl bg-slate-950 border border-slate-800/80 text-[11px] text-slate-300 leading-relaxed">
          <!-- Formula content -->
        </div>

        <div id="result-explanation-text" class="text-xs text-slate-300 bg-slate-950/70 p-3 rounded-xl border border-slate-800/70 leading-relaxed">
          <!-- Explanation content -->
        </div>
      </div>
    </div>

  </main>

  <script>
    // State Model
    const state = {
      nodes: [],
      edges: [],
      mode: 'select', // 'select' | 'vertex' | 'edge' | 'manual' | 'delete'
      selectedNodeId: null,
      edgeStartNodeId: null,
      isDragging: false,
      draggedNodeId: null,
      dragOffset: { x: 0, y: 0 },
      nextId: 0,
      currentResult: null,
      manualAssignments: new Map() // id => 0 (None) | 1 (Std) | 2 (High)
    };

    const svg = document.getElementById('graph-svg');
    const nodesLayer = document.getElementById('nodes-layer');
    const badgesLayer = document.getElementById('badges-layer');
    const edgesLayer = document.getElementById('edges-layer');
    const coverageBeamsLayer = document.getElementById('coverage-beams-layer');
    const tempEdgeLayer = document.getElementById('temp-edge-layer');

    const canvasGuideText = document.getElementById('canvas-guide-text');
    const manualPlayHud = document.getElementById('manual-play-hud');
    const manualStatsBadge = document.getElementById('manual-stats-badge');

    // Bottom Result Elements
    const bottomAnswerPanel = document.getElementById('bottom-answer-panel');
    const resultCardBox = document.getElementById('result-card-box');
    const resultIconBadge = document.getElementById('result-icon-badge');
    const resultTypeTag = document.getElementById('result-type-tag');
    const resultMainTitle = document.getElementById('result-main-title');
    const resultScoreHighlight = document.getElementById('result-score-highlight');
    const resultCostSubtext = document.getElementById('result-cost-subtext');
    const resultInstalledCount = document.getElementById('result-installed-count');
    const resultNodeChips = document.getElementById('result-node-chips');
    const resultFormulaBox = document.getElementById('result-formula-box');
    const resultExplanationText = document.getElementById('result-explanation-text');

    function setMode(newMode) {
      state.mode = newMode;
      state.edgeStartNodeId = null;
      clearTempEdge();

      ['select', 'vertex', 'edge', 'manual', 'delete'].forEach(m => {
        const btn = document.getElementById(`mode-${m}`);
        if (!btn) return;
        if (m === newMode) {
          btn.className = 'flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-slate-800 text-emerald-400 shrink-0 whitespace-nowrap font-black';
        } else {
          btn.className = 'flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 shrink-0 whitespace-nowrap font-semibold';
        }
      });

      if (newMode === 'manual') {
        manualPlayHud.classList.remove('hidden');
        canvasGuideText.innerText = "지점을 탭하여 [0원 → 1원 → 2원]을 변경해보세요.";
        updateManualStatsDisplay();
      } else {
        manualPlayHud.classList.add('hidden');
      }

      switch(newMode) {
        case 'select':
          canvasGuideText.innerText = "지점을 드래그하여 이동할 수 있습니다.";
          break;
        case 'vertex':
          canvasGuideText.innerText = "빈 곳을 터치하면 새 지점이 생깁니다.";
          break;
        case 'edge':
          canvasGuideText.innerText = "이어줄 두 지점을 차례로 터치하세요.";
          break;
        case 'delete':
          canvasGuideText.innerText = "지우고 싶은 지점이나 길을 터치하세요.";
          break;
      }
      render();
    }

    function addNode(x, y) {
      const id = state.nextId++;
      state.nodes.push({
        id: id,
        x: Math.round(x),
        y: Math.round(y),
        label: `${id + 1}번`
      });
      state.manualAssignments.set(id, 0);
      state.currentResult = null;
      bottomAnswerPanel.classList.add('hidden');
      render();
      updateStats();
      if (state.mode === 'manual') updateManualStatsDisplay();
    }

    function removeNode(id) {
      state.nodes = state.nodes.filter(n => n.id !== id);
      state.edges = state.edges.filter(e => e.u !== id && e.v !== id);
      state.manualAssignments.delete(id);
      if (state.selectedNodeId === id) state.selectedNodeId = null;
      if (state.edgeStartNodeId === id) state.edgeStartNodeId = null;
      state.currentResult = null;
      bottomAnswerPanel.classList.add('hidden');
      render();
      updateStats();
      if (state.mode === 'manual') updateManualStatsDisplay();
    }

    function addEdge(u, v) {
      if (u === v) return;
      const min = Math.min(u, v);
      const max = Math.max(u, v);
      const exists = state.edges.some(e => e.u === min && e.v === max);
      if (!exists) {
        state.edges.push({ u: min, v: max });
        state.currentResult = null;
        bottomAnswerPanel.classList.add('hidden');
        render();
        updateStats();
        if (state.mode === 'manual') updateManualStatsDisplay();
      }
    }

    function removeEdge(u, v) {
      const min = Math.min(u, v);
      const max = Math.max(u, v);
      state.edges = state.edges.filter(e => !(e.u === min && e.v === max));
      state.currentResult = null;
      bottomAnswerPanel.classList.add('hidden');
      render();
      updateStats();
      if (state.mode === 'manual') updateManualStatsDisplay();
    }

    function clearGraph() {
      state.nodes = [];
      state.edges = [];
      state.nextId = 0;
      state.selectedNodeId = null;
      state.edgeStartNodeId = null;
      state.currentResult = null;
      state.manualAssignments.clear();
      bottomAnswerPanel.classList.add('hidden');
      render();
      updateStats();
      if (state.mode === 'manual') updateManualStatsDisplay();
    }

    function resetResultHighlights() {
      state.currentResult = null;
      state.manualAssignments.clear();
      state.nodes.forEach(n => state.manualAssignments.set(n.id, 0));
      bottomAnswerPanel.classList.add('hidden');
      render();
      if (state.mode === 'manual') updateManualStatsDisplay();
    }

    function updateStats() {
      document.getElementById('stat-vertex-count').innerText = state.nodes.length;
      document.getElementById('stat-edge-count').innerText = state.edges.length;
    }

    function clearTempEdge() {
      tempEdgeLayer.innerHTML = '';
    }

    function computeDistanceMatrix() {
      const n = state.nodes.length;
      const indexMap = new Map();
      state.nodes.forEach((node, idx) => indexMap.set(node.id, idx));

      const adj = Array.from({ length: n }, () => []);
      state.edges.forEach(edge => {
        const u = indexMap.get(edge.u);
        const v = indexMap.get(edge.v);
        if (u !== undefined && v !== undefined) {
          adj[u].push(v);
          adj[v].push(u);
        }
      });

      const dist = Array.from({ length: n }, () => Array(n).fill(Infinity));
      for (let i = 0; i < n; i++) {
        dist[i][i] = 0;
        const queue = [i];
        let head = 0;
        while (head < queue.length) {
          const cur = queue[head++];
          for (const nxt of adj[cur]) {
            if (dist[i][nxt] === Infinity) {
              dist[i][nxt] = dist[i][cur] + 1;
              queue.push(nxt);
            }
          }
        }
      }
      return { n, indexMap, dist };
    }

    function getCoverageStatus(assignmentMap) {
      const { n, indexMap, dist } = computeDistanceMatrix();
      const covered = new Set();

      state.nodes.forEach(uNode => {
        const uIdx = indexMap.get(uNode.id);
        const level = assignmentMap.get(uNode.id) || 0;
        if (level === 0) return;

        for (let vIdx = 0; vIdx < n; vIdx++) {
          const d = dist[uIdx][vIdx];
          if ((level === 1 && d <= 1) || (level === 2 && d <= 2)) {
            covered.add(state.nodes[vIdx].id);
          }
        }
      });

      return covered;
    }

    function buildBitNeighborhoods() {
      const n = state.nodes.length;
      const indexMap = new Map();
      state.nodes.forEach((node, idx) => indexMap.set(node.id, idx));

      const closedN = new Array(n).fill(0);
      for (let i = 0; i < n; i++) closedN[i] = (1 << i);

      const adj = new Array(n).fill(0);
      state.edges.forEach(edge => {
        const uIdx = indexMap.get(edge.u);
        const vIdx = indexMap.get(edge.v);
        if (uIdx !== undefined && vIdx !== undefined) {
          closedN[uIdx] |= (1 << vIdx);
          closedN[vIdx] |= (1 << uIdx);
          adj[uIdx] |= (1 << vIdx);
          adj[vIdx] |= (1 << uIdx);
        }
      });

      return { n, indexMap, closedN, adj };
    }

    function render() {
      // 1. Draw Edges
      edgesLayer.innerHTML = '';
      state.edges.forEach(edge => {
        const u = state.nodes.find(n => n.id === edge.u);
        const v = state.nodes.find(n => n.id === edge.v);
        if (!u || !v) return;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', u.x);
        line.setAttribute('y1', u.y);
        line.setAttribute('x2', v.x);
        line.setAttribute('y2', v.y);
        line.setAttribute('stroke', '#334155');
        line.setAttribute('stroke-width', '3.5');
        line.setAttribute('stroke-linecap', 'round');

        line.addEventListener('click', (e) => {
          e.stopPropagation();
          if (state.mode === 'delete') removeEdge(edge.u, edge.v);
        });

        edgesLayer.appendChild(line);
      });

      let currentAssignments = new Map();
      let activeResultType = null;

      if (state.mode === 'manual') {
        currentAssignments = state.manualAssignments;
        activeResultType = 'manual';
      } else if (state.currentResult) {
        currentAssignments = state.currentResult.assignments;
        activeResultType = state.currentResult.type;
      }

      const coveredSet = getCoverageStatus(currentAssignments);

      // 2. Beams (Active Surveillance Lines)
      coverageBeamsLayer.innerHTML = '';
      state.edges.forEach(edge => {
        const uLvl = currentAssignments.get(edge.u) || 0;
        const vLvl = currentAssignments.get(edge.v) || 0;
        const u = state.nodes.find(n => n.id === edge.u);
        const v = state.nodes.find(n => n.id === edge.v);
        if (!u || !v) return;

        if (uLvl >= 1 || vLvl >= 1) {
          const isHigh = (uLvl === 2 || vLvl === 2);
          const beam = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          beam.setAttribute('x1', u.x);
          beam.setAttribute('y1', u.y);
          beam.setAttribute('x2', v.x);
          beam.setAttribute('y2', v.y);

          if (isHigh) {
            beam.setAttribute('stroke', '#f59e0b');
            beam.setAttribute('stroke-width', '4.5');
            beam.setAttribute('stroke-opacity', '0.85');
            beam.setAttribute('stroke-dasharray', '6 3');
          } else {
            const beamCol = activeResultType === 'indep' ? '#c084fc' : '#34d399';
            beam.setAttribute('stroke', beamCol);
            beam.setAttribute('stroke-width', '4');
            beam.setAttribute('stroke-opacity', '0.8');
            beam.setAttribute('stroke-dasharray', '5 2.5');
          }
          coverageBeamsLayer.appendChild(beam);
        }
      });

      // 3. Draw Nodes and Floating Badges
      nodesLayer.innerHTML = '';
      badgesLayer.innerHTML = '';

      state.nodes.forEach(node => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${node.x}, ${node.y})`);

        const level = currentAssignments.get(node.id) || 0;
        const isSelected = state.selectedNodeId === node.id || state.edgeStartNodeId === node.id;
        const isCovered = coveredSet.has(node.id);

        // Animated Radar Rings
        if (level === 2) {
          const rHigh = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          rHigh.setAttribute('r', '20');
          rHigh.setAttribute('fill', 'none');
          rHigh.setAttribute('stroke', '#f59e0b');
          rHigh.setAttribute('stroke-width', '3');
          rHigh.classList.add('radar-high');
          g.appendChild(rHigh);
        } else if (level === 1) {
          const rStd = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          rStd.setAttribute('r', '18');
          rStd.setAttribute('fill', 'none');
          rStd.setAttribute('stroke', activeResultType === 'indep' ? '#a855f7' : '#10b981');
          rStd.setAttribute('stroke-width', '2.5');
          rStd.classList.add('radar-std');
          g.appendChild(rStd);
        }

        // Surrounding Protected Halo
        if (isCovered && level === 0) {
          const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          halo.setAttribute('r', '22');
          halo.setAttribute('fill', '#052e16');
          halo.setAttribute('fill-opacity', '0.5');
          halo.setAttribute('stroke', '#10b981');
          halo.setAttribute('stroke-width', '1.5');
          halo.setAttribute('stroke-dasharray', '3 2');
          g.appendChild(halo);
        }

        // Node Circle
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('r', level === 2 ? '20' : '18');

        if (level === 2) {
          circle.setAttribute('fill', '#d97706');
          circle.setAttribute('stroke', '#fef3c7');
          circle.setAttribute('stroke-width', '3');
          circle.setAttribute('filter', 'url(#glow-gold)');
        } else if (level === 1) {
          const fillC = activeResultType === 'indep' ? '#7e22ce' : '#059669';
          const strokeC = activeResultType === 'indep' ? '#f3e8ff' : '#d1fae5';
          circle.setAttribute('fill', fillC);
          circle.setAttribute('stroke', strokeC);
          circle.setAttribute('stroke-width', '3');
          circle.setAttribute('filter', activeResultType === 'indep' ? 'url(#glow-purple)' : 'url(#glow-green)');
        } else if (isSelected) {
          circle.setAttribute('fill', '#4338ca');
          circle.setAttribute('stroke', '#a5b4fc');
          circle.setAttribute('stroke-width', '3');
        } else if (isCovered) {
          circle.setAttribute('fill', '#1e293b');
          circle.setAttribute('stroke', '#10b981');
          circle.setAttribute('stroke-width', '2');
        } else {
          circle.setAttribute('fill', '#0f172a');
          circle.setAttribute('stroke', '#64748b');
          circle.setAttribute('stroke-width', '2');
        }
        g.appendChild(circle);

        // Center Icon/Text
        if (level === 2) {
          const icon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          icon.setAttribute('text-anchor', 'middle');
          icon.setAttribute('dominant-baseline', 'central');
          icon.setAttribute('font-size', '13');
          icon.setAttribute('pointer-events', 'none');
          icon.textContent = '🚀';
          g.appendChild(icon);
        } else if (level === 1) {
          const icon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          icon.setAttribute('text-anchor', 'middle');
          icon.setAttribute('dominant-baseline', 'central');
          icon.setAttribute('font-size', '12');
          icon.setAttribute('pointer-events', 'none');
          icon.textContent = '📹';
          g.appendChild(icon);
        } else {
          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          label.setAttribute('text-anchor', 'middle');
          label.setAttribute('dominant-baseline', 'central');
          label.setAttribute('font-size', '10');
          label.setAttribute('font-weight', '900');
          label.setAttribute('fill', isCovered ? '#6ee7b7' : '#94a3b8');
          label.setAttribute('pointer-events', 'none');
          label.textContent = node.label;
          g.appendChild(label);
        }

        // Touch & Mouse Handlers for Mobile
        g.addEventListener('mousedown', (e) => onNodeDragStart(e.clientX, e.clientY, node.id));
        g.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) {
            onNodeDragStart(e.touches[0].clientX, e.touches[0].clientY, node.id);
          }
        }, { passive: false });

        g.addEventListener('click', (e) => onNodeClick(e, node.id));

        nodesLayer.appendChild(g);

        // Floating Badge Over Node
        if (level > 0 || (state.currentResult && isCovered)) {
          const bg = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          bg.setAttribute('transform', `translate(${node.x}, ${node.y - 28})`);
          bg.classList.add('badge-pop', 'pointer-events-none');

          let badgeColor = '#10b981';
          let badgeBorder = '#d1fae5';
          let badgeText = `${node.label}: CCTV`;

          if (level === 2) {
            badgeColor = '#f59e0b';
            badgeBorder = '#fef3c7';
            badgeText = `${node.label}: 고성능(2원)`;
          } else if (level === 1) {
            if (activeResultType === 'indep') {
              badgeColor = '#a855f7';
              badgeBorder = '#f3e8ff';
              badgeText = `${node.label}: 독립CCTV`;
            } else {
              badgeText = `${node.label}: CCTV(1원)`;
            }
          } else if (level === 0 && isCovered) {
            badgeColor = '#065f46';
            badgeBorder = '#34d399';
            badgeText = `안전`;
          }

          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          const width = badgeText.length * 9 + 10;
          rect.setAttribute('x', -width / 2);
          rect.setAttribute('y', -8);
          rect.setAttribute('width', width);
          rect.setAttribute('height', '17');
          rect.setAttribute('rx', '8.5');
          rect.setAttribute('fill', badgeColor);
          rect.setAttribute('stroke', badgeBorder);
          rect.setAttribute('stroke-width', '1.2');
          bg.appendChild(rect);

          const bLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          bLabel.setAttribute('text-anchor', 'middle');
          bLabel.setAttribute('dominant-baseline', 'central');
          bLabel.setAttribute('font-size', '9');
          bLabel.setAttribute('font-weight', '900');
          bLabel.setAttribute('fill', '#ffffff');
          bLabel.textContent = badgeText;
          bg.appendChild(bLabel);

          badgesLayer.appendChild(bg);
        }
      });
    }

    function getSvgCoordinates(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    svg.addEventListener('click', (e) => {
      if (e.target !== svg) return;
      const coords = getSvgCoordinates(e.clientX, e.clientY);

      if (state.mode === 'vertex') {
        addNode(coords.x, coords.y);
      } else if (state.mode === 'edge' && state.edgeStartNodeId !== null) {
        state.edgeStartNodeId = null;
        clearTempEdge();
        render();
      }
    });

    function onNodeClick(e, nodeId) {
      e.stopPropagation();

      if (state.mode === 'delete') {
        removeNode(nodeId);
        return;
      }

      if (state.mode === 'manual') {
        const cur = state.manualAssignments.get(nodeId) || 0;
        const nxt = (cur + 1) % 3;
        state.manualAssignments.set(nodeId, nxt);
        state.currentResult = null;
        bottomAnswerPanel.classList.add('hidden');
        updateManualStatsDisplay();
        render();
        return;
      }

      if (state.mode === 'edge') {
        if (state.edgeStartNodeId === null) {
          state.edgeStartNodeId = nodeId;
          const nodeName = state.nodes.find(n => n.id === nodeId)?.label;
          canvasGuideText.innerText = `[${nodeName}] 선택됨: 연결할 다른 지점을 터치하세요.`;
          render();
        } else {
          addEdge(state.edgeStartNodeId, nodeId);
          state.edgeStartNodeId = null;
          clearTempEdge();
          canvasGuideText.innerText = "길 연결 모드: 이어줄 두 지점을 차례로 터치하세요.";
          render();
        }
        return;
      }

      if (state.mode === 'select') {
        if (state.selectedNodeId === null) {
          state.selectedNodeId = nodeId;
        } else if (state.selectedNodeId === nodeId) {
          state.selectedNodeId = null;
        } else {
          addEdge(state.selectedNodeId, nodeId);
          state.selectedNodeId = null;
        }
        render();
      }
    }

    function onNodeDragStart(clientX, clientY, nodeId) {
      if (state.mode !== 'select') return;
      state.isDragging = true;
      state.draggedNodeId = nodeId;
      const coords = getSvgCoordinates(clientX, clientY);
      const node = state.nodes.find(n => n.id === nodeId);
      state.dragOffset = {
        x: coords.x - node.x,
        y: coords.y - node.y
      };
    }

    function handlePointerMove(clientX, clientY) {
      if (state.isDragging && state.draggedNodeId !== null) {
        const coords = getSvgCoordinates(clientX, clientY);
        const node = state.nodes.find(n => n.id === state.draggedNodeId);
        if (node) {
          const rect = svg.getBoundingClientRect();
          node.x = Math.max(25, Math.min(rect.width - 25, coords.x - state.dragOffset.x));
          node.y = Math.max(25, Math.min(rect.height - 25, coords.y - state.dragOffset.y));
          render();
        }
      } else if (state.mode === 'edge' && state.edgeStartNodeId !== null) {
        const coords = getSvgCoordinates(clientX, clientY);
        const startNode = state.nodes.find(n => n.id === state.edgeStartNodeId);
        if (startNode) {
          tempEdgeLayer.innerHTML = '';
          const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          tempLine.setAttribute('x1', startNode.x);
          tempLine.setAttribute('y1', startNode.y);
          tempLine.setAttribute('x2', coords.x);
          tempLine.setAttribute('y2', coords.y);
          tempLine.setAttribute('stroke', '#34d399');
          tempLine.setAttribute('stroke-width', '2.5');
          tempLine.setAttribute('stroke-dasharray', '5 3');
          tempEdgeLayer.appendChild(tempLine);
        }
      }
    }

    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (state.isDragging && e.touches.length > 0) {
        e.preventDefault();
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    window.addEventListener('mouseup', () => {
      state.isDragging = false;
      state.draggedNodeId = null;
    });
    window.addEventListener('touchend', () => {
      state.isDragging = false;
      state.draggedNodeId = null;
    });

    function updateManualStatsDisplay() {
      const total = state.nodes.length;
      if (total === 0) {
        manualStatsBadge.innerText = '지점 없음';
        return;
      }

      let countStd = 0;
      let countHigh = 0;
      state.nodes.forEach(n => {
        const lvl = state.manualAssignments.get(n.id) || 0;
        if (lvl === 1) countStd++;
        if (lvl === 2) countHigh++;
      });
      const cost = countStd * 1 + countHigh * 2;
      const covSet = getCoverageStatus(state.manualAssignments);
      const isFull = (covSet.size === total);

      manualStatsBadge.innerHTML = `총비용 <strong>${cost}원</strong> | 감시 <strong>${covSet.size}/${total}</strong> ${isFull ? '🎉 성공!' : ''}`;
      manualStatsBadge.className = isFull 
        ? 'px-2 py-0.5 rounded text-[10px] font-black bg-emerald-500/30 border border-emerald-400 text-emerald-300'
        : 'px-2 py-0.5 rounded text-[10px] font-black bg-amber-500/20 text-amber-300';
    }

    // Solver 1: Minimum Standard Dominating Set
    function calculateDominatingSet() {
      if (state.nodes.length === 0) {
        alert("마을에 지점이 없습니다. 먼저 지점을 추가해주세요!");
        return;
      }

      const { n, closedN } = buildBitNeighborhoods();
      const allMask = (1 << n) - 1;
      let bestMask = 0;
      let found = false;

      for (let k = 1; k <= n; k++) {
        function searchCombinations(startIdx, countLeft, curMask, curCov) {
          if (found) return;
          if (countLeft === 0) {
            if (curCov === allMask) {
              bestMask = curMask;
              found = true;
            }
            return;
          }
          for (let i = startIdx; i <= n - countLeft; i++) {
            searchCombinations(
              i + 1,
              countLeft - 1,
              curMask | (1 << i),
              curCov | closedN[i]
            );
            if (found) return;
          }
        }
        searchCombinations(0, k, 0, 0);
        if (found) break;
      }

      const assignmentMap = new Map();
      const domIds = [];
      state.nodes.forEach(n => assignmentMap.set(n.id, 0));

      for (let i = 0; i < n; i++) {
        if ((bestMask & (1 << i)) !== 0) {
          const id = state.nodes[i].id;
          assignmentMap.set(id, 1);
          domIds.push(id);
        }
      }

      const selectedLabels = domIds.map(id => state.nodes.find(n => n.id === id)?.label || `${id + 1}번`);

      state.currentResult = {
        type: 'dom',
        count: domIds.length,
        cost: domIds.length,
        assignments: assignmentMap,
        set: domIds,
        labels: selectedLabels
      };

      showResultInBottomPanel('dom', domIds.length, selectedLabels, domIds.length);
      render();
    }

    // Solver 2: Minimum Independent Dominating Set
    function calculateIndependentDominatingSet() {
      if (state.nodes.length === 0) {
        alert("마을에 지점이 없습니다. 먼저 지점을 추가해주세요!");
        return;
      }

      const { n, closedN, adj } = buildBitNeighborhoods();
      const allMask = (1 << n) - 1;
      let bestMask = 0;
      let found = false;

      for (let k = 1; k <= n; k++) {
        function searchIndependent(startIdx, countLeft, curMask, curCov, forbidMask) {
          if (found) return;
          if (countLeft === 0) {
            if (curCov === allMask) {
              bestMask = curMask;
              found = true;
            }
            return;
          }
          for (let i = startIdx; i <= n - countLeft; i++) {
            if ((forbidMask & (1 << i)) !== 0) continue;
            searchIndependent(
              i + 1,
              countLeft - 1,
              curMask | (1 << i),
              curCov | closedN[i],
              forbidMask | adj[i]
            );
            if (found) return;
          }
        }
        searchIndependent(0, k, 0, 0, 0);
        if (found) break;
      }

      const assignmentMap = new Map();
      const indepIds = [];
      state.nodes.forEach(n => assignmentMap.set(n.id, 0));

      for (let i = 0; i < n; i++) {
        if ((bestMask & (1 << i)) !== 0) {
          const id = state.nodes[i].id;
          assignmentMap.set(id, 1);
          indepIds.push(id);
        }
      }

      const selectedLabels = indepIds.map(id => state.nodes.find(n => n.id === id)?.label || `${id + 1}번`);

      state.currentResult = {
        type: 'indep',
        count: indepIds.length,
        cost: indepIds.length,
        assignments: assignmentMap,
        set: indepIds,
        labels: selectedLabels
      };

      showResultInBottomPanel('indep', indepIds.length, selectedLabels, indepIds.length);
      render();
    }

    // Solver 3: High-Performance Optimal Cost
    function calculateHighPerfCost() {
      if (state.nodes.length === 0) {
        alert("마을에 지점이 없습니다. 먼저 지점을 추가해주세요!");
        return;
      }

      const { n, dist } = computeDistanceMatrix();
      const allMask = (1 << n) - 1;

      const cov1 = new Array(n).fill(0);
      const cov2 = new Array(n).fill(0);

      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          if (dist[i][j] <= 1) cov1[i] |= (1 << j);
          if (dist[i][j] <= 2) cov2[i] |= (1 << j);
        }
      }

      let upperCost = n;
      for (let k = 1; k <= n; k++) {
        let f = false;
        function findQ(st, left, mask) {
          if (f) return;
          if (left === 0) { if (mask === allMask) f = true; return; }
          for (let i = st; i <= n - left; i++) {
            findQ(i + 1, left - 1, mask | cov1[i]);
            if (f) return;
          }
        }
        findQ(0, k, 0);
        if (f) { upperCost = k; break; }
      }

      let bestAssignment = null;
      let minTotalCost = upperCost;
      let foundSolution = false;

      for (let targetCost = 1; targetCost <= upperCost; targetCost++) {
        const curAssign = new Array(n).fill(0);

        function branchAndBound(idx, curCost, curCoverage) {
          if (foundSolution) return;
          if (curCoverage === allMask) {
            minTotalCost = curCost;
            bestAssignment = [...curAssign];
            foundSolution = true;
            return;
          }
          if (idx >= n || curCost >= targetCost) return;

          // Branch High (Cost +2)
          if (curCost + 2 <= targetCost) {
            curAssign[idx] = 2;
            branchAndBound(idx + 1, curCost + 2, curCoverage | cov2[idx]);
            if (foundSolution) return;
          }

          // Branch Standard (Cost +1)
          if (curCost + 1 <= targetCost) {
            curAssign[idx] = 1;
            branchAndBound(idx + 1, curCost + 1, curCoverage | cov1[idx]);
            if (foundSolution) return;
          }

          // Branch Zero (Cost +0)
          curAssign[idx] = 0;
          branchAndBound(idx + 1, curCost, curCoverage);
        }

        branchAndBound(0, 0, 0);
        if (foundSolution) break;
      }

      if (!bestAssignment) {
        bestAssignment = new Array(n).fill(1);
        minTotalCost = upperCost;
      }

      const assignmentMap = new Map();
      const stdIds = [];
      const highIds = [];

      for (let i = 0; i < n; i++) {
        const lvl = bestAssignment[i];
        const id = state.nodes[i].id;
        assignmentMap.set(id, lvl);
        if (lvl === 1) stdIds.push(id);
        if (lvl === 2) highIds.push(id);
      }

      const stdLabels = stdIds.map(id => state.nodes.find(n => n.id === id)?.label || `${id + 1}번`);
      const highLabels = highIds.map(id => state.nodes.find(n => n.id === id)?.label || `${id + 1}번`);

      state.currentResult = {
        type: 'high_perf',
        cost: minTotalCost,
        baseDomCost: upperCost,
        assignments: assignmentMap,
        stdSet: stdIds,
        highSet: highIds,
        stdLabels: stdLabels,
        highLabels: highLabels
      };

      showHighPerfInBottomPanel(stdLabels, highLabels, minTotalCost, upperCost);
      render();
    }

    // Display in Bottom Result Panel (Leaves Graph 100% Visible)
    function showResultInBottomPanel(type, count, labels, cost) {
      bottomAnswerPanel.classList.remove('hidden');
      const isDom = (type === 'dom');

      resultCardBox.className = isDom
        ? 'p-3.5 sm:p-4 rounded-2xl bg-slate-900 border border-emerald-500/50 shadow-lg space-y-2.5'
        : 'p-3.5 sm:p-4 rounded-2xl bg-slate-900 border border-purple-500/50 shadow-lg space-y-2.5';

      resultIconBadge.className = isDom
        ? 'w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-sm font-black shrink-0'
        : 'w-8 h-8 rounded-xl bg-purple-500/20 text-purple-400 border border-purple-500/30 flex items-center justify-center text-sm font-black shrink-0';
      resultIconBadge.textContent = isDom ? '📹' : '🚫';

      resultTypeTag.className = isDom ? 'text-[10px] font-black uppercase text-emerald-400' : 'text-[10px] font-black uppercase text-purple-400';
      resultTypeTag.textContent = isDom ? '최소 CCTV 정답' : '서로 안 붙은 최소 CCTV 정답';

      resultMainTitle.textContent = isDom ? '마을 감시 최소 CCTV 개수' : '서로 붙어 있지 않은 최소 CCTV';

      resultScoreHighlight.className = isDom ? 'text-2xl font-black text-emerald-400' : 'text-2xl font-black text-purple-400';
      resultScoreHighlight.textContent = `${count}대`;

      resultCostSubtext.textContent = `설치 비용: 총 ${cost}원`;
      resultInstalledCount.textContent = `총 ${count}곳 선택`;

      resultNodeChips.innerHTML = labels.map(l => 
        `<span class="px-2 py-0.5 rounded-md text-xs font-black ${isDom ? 'bg-emerald-500 text-slate-950' : 'bg-purple-500 text-white'}">${l}</span>`
      ).join('');

      resultFormulaBox.classList.add('hidden');

      if (isDom) {
        resultExplanationText.innerHTML = `
          마을의 모든 지점을 안전하게 비추는 <strong>최소 CCTV는 ${count}대</strong>입니다.
          그래프에서 초록색으로 표시된 <strong>[${labels.join(', ')}]</strong> 지점에 설치하면 마을 전체가 100% 감시됩니다.
        `;
      } else {
        resultExplanationText.innerHTML = `
          CCTV끼리 직접 길로 이어지지 않게 설치하는 <strong>최소 CCTV는 ${count}대</strong>입니다.
          보라색으로 표시된 <strong>[${labels.join(', ')}]</strong> 지점들은 서로 완전히 떨어져 있으면서도 마을을 안전하게 지킵니다.
        `;
      }

      // Smooth scroll to answer
      bottomAnswerPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showHighPerfInBottomPanel(stdLabels, highLabels, minCost, baseCost) {
      bottomAnswerPanel.classList.remove('hidden');

      resultCardBox.className = 'p-3.5 sm:p-4 rounded-2xl bg-slate-900 border border-amber-500/50 shadow-lg space-y-2.5';
      resultIconBadge.className = 'w-8 h-8 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center justify-center text-sm font-black shrink-0';
      resultIconBadge.textContent = '🚀';

      resultTypeTag.className = 'text-[10px] font-black uppercase text-amber-400';
      resultTypeTag.textContent = '고성능 고려 최적 비용 정답';

      resultMainTitle.textContent = '고성능(거리 2) 고려 최소 설치 비용';

      resultScoreHighlight.className = 'text-2xl font-black text-amber-300';
      resultScoreHighlight.textContent = `${minCost}원`;

      resultCostSubtext.textContent = `고성능 ${highLabels.length}대 + 일반 ${stdLabels.length}대`;
      resultInstalledCount.textContent = `총 ${highLabels.length + stdLabels.length}곳 선택`;

      let chips = '';
      if (highLabels.length > 0) {
        chips += highLabels.map(l => `<span class="px-2 py-0.5 rounded-md text-xs font-black bg-amber-500 text-slate-950 flex items-center gap-1">🚀 ${l}(2원)</span>`).join('');
      }
      if (stdLabels.length > 0) {
        chips += stdLabels.map(l => `<span class="px-2 py-0.5 rounded-md text-xs font-black bg-emerald-500 text-slate-950 flex items-center gap-1">📹 ${l}(1원)</span>`).join('');
      }
      resultNodeChips.innerHTML = chips || '<span class="text-slate-500 text-xs">설치 없음</span>';

      resultFormulaBox.classList.remove('hidden');
      resultFormulaBox.innerHTML = `
        • 고성능 CCTV: ${highLabels.length}대 × 2원 = <strong>${highLabels.length * 2}원</strong><br>
        • 일반 CCTV: ${stdLabels.length}대 × 1원 = <strong>${stdLabels.length * 1}원</strong><br>
        • <strong>합계 최솟값: ${minCost}원</strong>
      `;

      const saved = baseCost - minCost;
      let costEval = '';
      if (saved > 0) {
        costEval = `일반 CCTV만 쓸 때(${baseCost}원)보다 고성능 CCTV를 조합해 <strong>${saved}원의 비용을 절약</strong>했습니다!`;
      } else {
        costEval = `이 마을 구조는 고성능을 쓰는 것보다 <strong>일반 CCTV(1원)로 나누어 설치하는 것이 가장 경제적</strong>입니다!`;
      }

      resultExplanationText.innerHTML = `
        고성능 CCTV(비용 2)는 거리 2까지 넓게 감시합니다. ${costEval}
      `;

      bottomAnswerPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function loadPreset(name) {
      clearGraph();
      const rect = svg.getBoundingClientRect();
      const cx = (rect.width || 360) / 2;
      const cy = (rect.height || 380) / 2;

      if (name === 'wheel') {
        state.nodes.push({ id: 0, x: Math.round(cx), y: Math.round(cy), label: `광장` });
        const r = Math.min(cx, cy) * 0.72;
        for (let i = 0; i < 6; i++) {
          const angle = -Math.PI / 2 + (i * 2 * Math.PI) / 6;
          state.nodes.push({
            id: i + 1,
            x: Math.round(cx + r * Math.cos(angle)),
            y: Math.round(cy + r * Math.sin(angle)),
            label: `${i + 1}번`
          });
        }
        state.nextId = 7;
        for (let i = 1; i <= 6; i++) {
          addEdge(0, i);
          addEdge(i, i === 6 ? 1 : i + 1);
        }
      }
      else if (name === 'petersen') {
        const rOut = Math.min(cx, cy) * 0.76;
        const rIn = Math.min(cx, cy) * 0.40;
        for (let i = 0; i < 5; i++) {
          const angle = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
          state.nodes.push({ id: i, x: Math.round(cx + rOut * Math.cos(angle)), y: Math.round(cy + rOut * Math.sin(angle)), label: `외${i+1}` });
        }
        for (let i = 0; i < 5; i++) {
          const angle = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
          state.nodes.push({ id: i + 5, x: Math.round(cx + rIn * Math.cos(angle)), y: Math.round(cy + rIn * Math.sin(angle)), label: `안${i+1}` });
        }
        state.nextId = 10;
        for (let i = 0; i < 5; i++) addEdge(i, (i + 1) % 5);
        for (let i = 0; i < 5; i++) addEdge(i, i + 5);
        addEdge(5, 7); addEdge(7, 9); addEdge(9, 6); addEdge(6, 8); addEdge(8, 5);
      }
      else if (name === 'cycle7') {
        const r = Math.min(cx, cy) * 0.74;
        for (let i = 0; i < 7; i++) {
          const angle = -Math.PI / 2 + (i * 2 * Math.PI) / 7;
          state.nodes.push({
            id: i,
            x: Math.round(cx + r * Math.cos(angle)),
            y: Math.round(cy + r * Math.sin(angle)),
            label: `${i + 1}`
          });
        }
        state.nextId = 7;
        for (let i = 0; i < 7; i++) addEdge(i, (i + 1) % 7);
      }
      else if (name === 'k33') {
        const spanY = Math.min(cy * 0.65, 80);
        for (let i = 0; i < 3; i++) {
          state.nodes.push({ id: i, x: Math.round(cx - 95), y: Math.round(cy - spanY + i * spanY), label: `A${i+1}` });
          state.nodes.push({ id: i + 3, x: Math.round(cx + 95), y: Math.round(cy - spanY + i * spanY), label: `B${i+1}` });
        }
        state.nextId = 6;
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) addEdge(i, j + 3);
        }
      }
      else if (name === 'tree') {
        const dY = Math.min(cy * 0.45, 60);
        state.nodes.push({ id: 0, x: Math.round(cx), y: Math.round(cy - dY * 1.6), label: `뿌리` });
        state.nodes.push({ id: 1, x: Math.round(cx - 75), y: Math.round(cy - dY * 0.3), label: `가지1` });
        state.nodes.push({ id: 2, x: Math.round(cx + 75), y: Math.round(cy - dY * 0.3), label: `가지2` });
        state.nodes.push({ id: 3, x: Math.round(cx - 110), y: Math.round(cy + dY * 1.1), label: `잎1` });
        state.nodes.push({ id: 4, x: Math.round(cx - 45), y: Math.round(cy + dY * 1.1), label: `잎2` });
        state.nodes.push({ id: 5, x: Math.round(cx + 45), y: Math.round(cy + dY * 1.1), label: `잎3` });
        state.nodes.push({ id: 6, x: Math.round(cx + 110), y: Math.round(cy + dY * 1.1), label: `잎4` });
        state.nextId = 7;
        addEdge(0, 1); addEdge(0, 2);
        addEdge(1, 3); addEdge(1, 4);
        addEdge(2, 5); addEdge(2, 6);
      }

      state.nodes.forEach(n => state.manualAssignments.set(n.id, 0));
      render();
      updateStats();
      if (state.mode === 'manual') updateManualStatsDisplay();
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => loadPreset('wheel'), 50);
    });

    window.addEventListener('resize', () => {
      render();
    });
  </script>
</body>
